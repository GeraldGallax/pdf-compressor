<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compress PDF & Image - Punguza PDF Bure</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
body{font-family:Arial;background:#e8f5e9;margin:0;padding:15px}
.box{max-width:480px;margin:auto;background:#fff;border-radius:16px;padding:20px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.1)}
h1{font-size:24px;margin:5px 0}h2{font-size:15px;color:#333}
input[type=file]{margin:15px 0}
.mode{display:flex;gap:8px;margin:12px 0}
.mode button{padding:12px 5px;font-size:14px;border:2px solid #ddd;background:#f5f5f5;color:#333;line-height:1.3}
.mode button small{color:#555;font-size:11px;display:block;margin-top:4px;line-height:1.3}
.mode button.active{background:#1db954;color:#fff;border-color:#1db954}
.mode button.active small{color:#e8ffe8}
button.main{background:#1db954;color:#fff;border:0;padding:14px 20px;border-radius:10px;font-size:18px;font-weight:bold;width:100%;cursor:pointer}
#msg{margin-top:12px;font-weight:bold;color:#1b5e20}
#progress{margin-top:10px;color:#555}
#warn{margin-top:10px;color:#b71c1c;font-weight:bold;display:none;background:#ffebee;padding:10px;border-radius:8px}
a#dl{display:none;margin-top:12px;background:#1565c0;color:#fff;padding:12px;border-radius:10px;text-decoration:none;font-weight:bold}
small{color:#777}
</style>
</head>
<body>
<div class="box">
<h1>📄 Compress PDF & Image</h1>
<h2>Punguza PDF / Picha Bure - Bila Watermark<br>Chagua Unataka Iwe Kubwa Gani</h2>
<input type="file" id="file" accept=".pdf,.jpg,.jpeg,.png,.webp"><br>
<b>Unataka iwe MB ngapi?</b>
<div class="mode">
<button id="m1" onclick="setMode(1,this)">🎯 1MB<br><small>Kwa WhatsApp<br>Ndogo Kabisa</small></button>
<button id="m2" class="active" onclick="setMode(2,this)">🎯 2MB<br><small>Kawaida<br>Quality Nzuri</small></button>
<button id="m3" onclick="setMode(5,this)">🎯 5MB<br><small>Kwa Print<br>Quality Kubwa</small></button>
</div>
<button class="main" onclick="go()">COMPRESS NOW - KAZA SASA</button>
<div id="progress"></div>
<div id="msg"></div>
<div id="warn"></div>
<a id="dl" download>⬇️ DOWNLOAD - PAKUA FAILI</a>
<p><small>Free 3x per day | Pro 1,000/- or $1 Unlimited<br>Files deleted after 1 hour</small></p>
</div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let targetMB=2;
function setMode(m,btn){targetMB=m; document.querySelectorAll('.mode button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); document.getElementById('warn').style.display='none';}
async function compressPdfToTarget(buf, targetBytes, prog, totalPages){
  let attempts=[
    {scale:1.2, q:0.65},
    {scale:1.0, q:0.50},
    {scale:0.8, q:0.40},
    {scale:0.6, q:0.30},
    {scale:0.5, q:0.22},
    {scale:0.4, q:0.15}
  ];
  let pdf=await pdfjsLib.getDocument({data:buf}).promise;
  for(let a=0;a<attempts.length;a++){
    let {scale,q}=attempts[a];
    prog.textContent=`Inajaribu kufika ${targetMB}MB... Jaribio ${a+1}/6 (Quality ${Math.round(q*100)}%) - Ukurasa 0/${pdf.numPages}`;
    let out=await PDFLib.PDFDocument.create();
    for(let i=1;i<=pdf.numPages;i++){
      prog.textContent=`Inajaribu kufika ${targetMB}MB... Jaribio ${a+1}/6 - Ukurasa ${i}/${pdf.numPages}`;
      let page=await pdf.getPage(i);
      let vp=page.getViewport({scale:scale});
      let c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
      await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
      let dataUrl=c.toDataURL('image/jpeg',q);
      let img=await out.embedJpg(dataUrl);
      let p=out.addPage([img.width,img.height]); p.drawImage(img,{x:0,y:0,width:img.width,height:img.height});
    }
    let bytes=await out.save();
    let blob=new Blob([bytes],{type:'application/pdf'});
    if(blob.size <= targetBytes || a===attempts.length-1){
      return {blob, attempt:a+1, quality:q};
    }
  }
}
async function go(){
 let f=document.getElementById('file').files[0];
 if(!f){alert('Chagua faili kwanza!');return;}
 let prog=document.getElementById('progress'); let msg=document.getElementById('msg'); let warn=document.getElementById('warn');
 prog.textContent='Inakaza... subiri kidogo...'; msg.textContent=''; warn.style.display='none';
 try{
  if(f.type.startsWith('image/')){
    let img=new Image(); img.src=URL.createObjectURL(f);
    await new Promise(r=>img.onload=r);
    let targetBytes=targetMB*1024*1024;
    let quals=[0.7,0.5,0.35,0.2,0.12];
    let done=null;
    for(let qq of quals){
      let c=document.createElement('canvas'); let s=Math.min(1,1600/img.width);
      c.width=img.width*s; c.height=img.height*s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      let b=await new Promise(r=>c.toBlob(r,'image/jpeg',qq));
      if(b.size<=targetBytes || qq===0.12){ done=b; break; }
    }
    prog.textContent=`Imemaliza! Zamani: ${(f.size/1024/1024).toFixed(1)}MB -> Mpya: ${(done.size/1024/1024).toFixed(2)}MB (Target ${targetMB}MB)`;
    show(done,f.name.replace(/\.[^.]+$/,'')+'-'+targetMB+'MB.jpg');
  } else if(f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf')){
    let buf=await f.arrayBuffer();
    let res=await compressPdfToTarget(buf, targetMB*1024*1024, prog, 0);
    prog.textContent=`Imemaliza! Zamani: ${(f.size/1024/1024).toFixed(1)}MB -> Mpya: ${(res.blob.size/1024/1024).toFixed(2)}MB (Target ${targetMB}MB, Jaribio ${res.attempt})`;
    if(res.blob.size > targetMB*1024*1024){
      warn.style.display='block';
      warn.textContent=`Nimejaribu mara 6 kufika ${targetMB}MB. Hii ndio ndogo zaidi nimeweza: ${(res.blob.size/1024/1024).toFixed(2)}MB. Pakua hii au jaribu Target kubwa zaidi.`;
    }
    show(res.blob,f.name.replace('.pdf','')+'-'+targetMB+'MB.pdf');
  } else {alert('Chagua PDF au Picha tu');}
 }catch(e){prog.textContent='';msg.textContent='Imeshindwa: '+e.message;}
}
function show(blob,name){
 let a=document.getElementById('dl');
 a.href=URL.createObjectURL(blob); a.download=name; a.style.display='block';
 a.textContent='⬇️ DOWNLOAD - '+name+' ('+(blob.size/1024).toFixed(0)+' KB)';
 document.getElementById('msg').textContent='Imekamilika! ✅ Pakua sasa.';
}
</script>
</body>
 </html>
