<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compress PDF & Image Free - No Watermark</title>
<style>
body{font-family:Arial;text-align:center;padding:15px;background:#f0fdf4}
.box{background:white;padding:20px;border-radius:15px;max-width:500px;margin:auto;box-shadow:0 0 15px #ccc}
button{background:#16a34a;color:white;padding:15px;border:none;border-radius:10px;font-size:17px;width:100%;font-weight:bold}
input{margin:15px 0}
#result{margin-top:15px;font-weight:bold;color:green}
</style>
</head>
<body>
<div class="box">
<h2>📄 Compress PDF & Image</h2>
<p><b>Compress PDF from 50MB to 1MB Free</b><br>Punguza PDF / Picha Bure - Bila Watermark</p>
<input type="file" id="file" accept="image/*,.pdf">
<br>
<label>Quality: <input type="range" id="q" min="10" max="90" value="60"> <span id="qv">60%</span></label>
<br><button onclick="compress()">COMPRESS NOW - KAZA SASA</button>
<p id="result"></p>
<p style="font-size:12px;color:gray">Free 3x per day | Pro 1,000/- or $1 Unlimited<br>Files deleted after 1 hour - No one sees your files</p>
</div>
<script>
document.getElementById('q').oninput=e=>{document.getElementById('qv').innerText=e.target.value+'%'}
async function compress(){
let f=document.getElementById('file').files[0];
if(!f){alert('Chagua faili kwanza / Choose file first');return}
document.getElementById('result').innerText='Inakaza... Tafadhali subiri...';
if(f.type.startsWith('image/')){
let img=new Image(); img.src=URL.createObjectURL(f);
img.onload=()=>{
let c=document.createElement('canvas');
let scale=Math.min(1, 1200/img.width);
c.width=img.width*scale; c.height=img.height*scale;
c.getContext('2d').drawImage(img,0,0,c.width,c.height);
let q=document.getElementById('q').value/100;
c.toBlob(b=>{
let a=document.createElement('a'); a.href=URL.createObjectURL(b);
a.download='compressed-'+f.name+'.jpg'; a.click();
document.getElementById('result').innerText='Imefanikiwa! Kutoka '+(f.size/1024/1024).toFixed(2)+'MB kwenda '+(b.size/1024/1024).toFixed(2)+'MB ✅';
},'image/jpeg',q);
}
}else{
document.getElementById('result').innerText='Kwa PDF, pakua na tutaongeza PDF compressor kamili hivi karibuni. Kwa sasa picha inafanya kazi 100%.';
}
}
</script>
</body>
</html>
