hi<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compress PDF & Image</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
body{font-family:Arial;background:#e8f5e9;margin:0;padding:15px}
.box{max-width:480px;margin:auto;background:#fff;border-radius:16px;padding:20px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.1)}
h1{font-size:24px}h2{font-size:15px;color:#333}
input[type=file]{margin:12px 0}
.targetBox{background:#f1f8e9;padding:12px;border-radius:10px;margin:10px 0}
.targetBox input{font-size:22px;width:90px;text-align:center;padding:8px;border:2px solid #1db954;border-radius:8px;font-weight:bold}
.mode{display:flex;gap:8px;margin:12px 0}
.mode button{padding:12px 5px;font-size:14px;border:2px solid #ddd;background:#f5f5f5;color:#333;line-height:1.3}
.mode button small{color:#555;font-size:11px;display:block;margin-top:4px}
.mode button.active{background:#1db954;color:#fff;border-color:#1db954}
.mode button.active small{color:#e8ffe8}
button.main{background:#1db954;color:#fff;border:0;padding:14px 20px;border-radius:10px;font-size:18px;font-weight:bold;width:100%;cursor:pointer}
#msg{margin-top:12px;font-weight:bold;color:#1b5e20}
#progress{margin-top:10px;color:#555}
#warn{margin-top:10px;color:#b71c1c;font-weight:bold;display:none;background:#ffebee;padding:10px;border-radius:8px}
a#dl{display:none;margin-top:12px;background:#1565c0;color:#fff;padding:12px;border-radius:10px;text-decoration:none;font-weight:bold}
small{color:#777}
</style>
</head>
<body>
<div class="box">
<h1>📄 Compress PDF & Image</h1>
<h2>Punguza PDF / Picha Bure - Bila Watermark</h2>
<input type="file" id="file" accept=".pdf,.jpg,.jpeg,.png,.webp"><br>
<div class="targetBox">
<b>Unataka iwe MB ngapi?</b><br><br>
<input type="number" id="targetMB" value="5" min="0.5" max="100" step="0.5" oninput="checkRead()"> <b>MB</b><br>
<small>Mfano: PDF ya 200MB, andika 20 -> itakuwa 20MB<br>PDF ya 50MB, andika 2 -> itakuwa 2MB</small>
<div id="readWarn" style="display:none;margin-top:10px;background:#fff3e0;border:2px solid #ff9800;padding:10px;border-radius:8px;color:#e65100;font-weight:bold;font-size:13px;line-height:1.4"></div>
</div>
<b>Chagua Quality:</b>
<div class="mode">
<button id="m1" onclick="setMode('small',this)">📱 SMALL<br><small>Ndogo Kabisa<br>Kwa WhatsApp</small></button>
<button id="m2" class="active" onclick="setMode('balanced',this)">⚖️ BALANCED<br><small>Kawaida<br>Quality Nzuri</small></button>
<button id="m3" onclick="setMode('high',this)">🖨️ HIGH<br><small>Quality Kubwa<br>Kwa Print</small></button>
</div>
<button class="main" onclick="go()">COMPRESS NOW - KAZA SASA</button>
<div id="progress"></div>
<div id="msg"></div>
<div id="warn"></div>
<a id="dl" download>⬇️ DOWNLOAD</a>
<p><small>Free 3x per day | Pro 1,000/- or $1 Unlimited</small></p>
</div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let mode='balanced';
function checkRead(){
  let t=parseFloat(document.getElementById('targetMB').value);
  let f=document.getElementById('file').files[0];
  let w=document.getElementById('readWarn');
  if(!t){w.style.display='none'; return;}
  // Kama hajachagua faili bado, mwambie kulingana na target peke yake
  if(!f){
    if(t<=1){ w.style.display='block'; w.innerHTML='⚠️ ANGALIZO: Ukichagua 1MB au chini, PDF yenye maandishi madogo kama TimeTable inaweza ISIsomeke vizuri. Kama ni TimeTable / Mkataba, chagua 5MB au zaidi.'; }
    else if(t<=2){ w.style.display='block'; w.innerHTML='⚠️ ANGALIZO: 2MB ni ndogo. Kama PDF yako ina maandishi madogo sana, inaweza kupotea kidogo. Kwa kusomeka vizuri, chagua 5MB.'; }
    else { w.style.display='none'; }
    return;
  }
  let ratio = t*1024*1024 / f.size;
  if(ratio < 0.15){
    w.style.display='block';
    w.innerHTML=`⚠️ ANGALIZO KUBWA: Unataka kupunguza kutoka ${(f.size/1024/1024).toFixed(1)}MB hadi ${t}MB (umeipunguza zaidi ya 85%). Hii inaweza ISIsomeke vizuri, hasa maandishi madogo kama TimeTable. Ushauri: Chagua ${Math.ceil(f.size/1024/1024*0.3)}MB au zaidi ili isomeke.`;
  } else if(ratio < 0.35){
    w.style.display='block';
    w.innerHTML=`⚠️ ANGALIZO: Unapunguza sana (kutoka ${(f.size/1024/1024).toFixed(1)}MB hadi ${t}MB). Maandishi madogo yanaweza kupotea kidogo. Kama ni TimeTable, chagua kubwa zaidi kidogo.`;
  } else {
    w.style.display='none';
  }
}
function baseSettings(){
  if(mode==='small') return {scale:0.8, q:0.45};
  if(mode==='high') return {scale:1.4, q:0.80};
  return {scale:1.1, q:0.65};
}
async function go(){
 let f=document.getElementById('file').files[0];
 if(!f){alert('Chagua faili kwanza!');return;}
 let targetMB=parseFloat(document.getElementById('targetMB').value);
 if(!targetMB || targetMB<=0){alert('Andika MB unayotaka, mfano 20');return;}
 let targetBytes=targetMB*1024*1024;
 let prog=document.getElementById('progress'); let msg=document.getElementById('msg'); let warn=document.getElementById('warn');
 prog.textContent='Inakaza...'; msg.textContent=''; warn.style.display='none';
 try{
  if(f.type.startsWith('image/')){
    let img=new Image(); img.src=URL.createObjectURL(f);
    await new Promise(r=>img.onload=r);
    let base=baseSettings();
    let attempts=[{s:1,q:base.q},{s:0.8,q:base.q*0.8},{s:0.6,q:0.35},{s:0.5,q:0.25},{s:0.4,q:0.15}];
    let done=null, used='';
    for(let a=0;a<attempts.length;a++){
      let c=document.createElement('canvas'); c.width=img.width*attempts[a].s; c.height=img.height*attempts[a].s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      let b=await new Promise(r=>c.toBlob(r,'image/jpeg',attempts[a].q));
      prog.textContent=`Inajaribu kufika ${targetMB}MB... Jaribio ${a+1}/5`;
      done=b; used=`Jaribio ${a+1}`;
      if(b.size<=targetBytes) break;
    }
    prog.textContent=`Imemaliza! Zamani: ${(f.size/1024/1024).toFixed(1)}MB -> Mpya: ${(done.size/1024/1024).toFixed(2)}MB (Ulitaka ${targetMB}MB, ${mode})`;
    show(done, f.name.replace(/\.[^.]+$/,'')+'-'+targetMB+'MB.jpg');
  } else if(f.name.toLowerCase().endsWith('.pdf')){
    let buf=await f.arrayBuffer();
    let pdf=await pdfjsLib.getDocument({data:buf}).promise;
    let base=baseSettings();
    // Hesabu kuanzia wapi kulingana na uwiano wa Target / Original
    let ratio = targetBytes / f.size;
    let startScale = ratio >= 1 ? base.scale : Math.max(0.35, base.scale * Math.sqrt(ratio));
    let attempts=[
      {scale:startScale, q:base.q},
      {scale:startScale*0.85, q:base.q*0.8},
      {scale:startScale*0.70, q:0.40},
      {scale:startScale*0.55, q:0.30},
      {scale:0.4, q:0.20},
      {scale:0.3, q:0.12}
    ];
    let finalBlob=null, attemptNo=1;
    for(let a=0;a<attempts.length;a++){
      attemptNo=a+1;
      let out=await PDFLib.PDFDocument.create();
      for(let i=1;i<=pdf.numPages;i++){
        prog.textContent=`Inajaribu kufika ${targetMB}MB... Jaribio ${a+1}/6 - Ukurasa ${i}/${pdf.numPages}`;
        let page=await pdf.getPage(i);
        let vp=page.getViewport({scale:attempts[a].scale});
        let c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
        await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
        let dataUrl=c.toDataURL('image/jpeg',attempts[a].q);
        let img=await out.embedJpg(dataUrl);
        let p=out.addPage([img.width,img.height]); p.drawImage(img,{x:0,y:0,width:img.width,height:img.height});
      }
      let bytes=await out.save();
      finalBlob=new Blob([bytes],{type:'application/pdf'});
      if(finalBlob.size <= targetBytes) break;
    }
    prog.textContent=`Imemaliza! Zamani: ${(f.size/1024/1024).toFixed(1)}MB -> Mpya: ${(finalBlob.size/1024/1024).toFixed(2)}MB (Ulitaka ${targetMB}MB, ${mode}, Jaribio ${attemptNo})`;
    if(finalBlob.size > targetBytes){
      warn.style.display='block';
      warn.textContent=`Nimejaribu mara 6. Ndogo zaidi nimeweza ni ${(finalBlob.size/1024/1024).toFixed(2)}MB. Jaribu kuongeza Target au chagua SMALL.`;
    }
    show(finalBlob, f.name.replace('.pdf','')+'-'+targetMB+'MB.pdf');
  } else alert('Chagua PDF au Picha tu');
 }catch(e){prog.textContent='';msg.textContent='Imeshindwa: '+e.message;}
}
function show(blob,name){
 let a=document.getElementById('dl');
 a.href=URL.createObjectURL(blob); a.download=name; a.style.display='block';
 a.textContent='⬇️ DOWNLOAD - '+name+' ('+(blob.size/1024).toFixed(0)+' KB)';
 document.getElementById('msg').textContent='Imekamilika! ✅ Pakua sasa.';
}
</script>
</body>
  </html>
